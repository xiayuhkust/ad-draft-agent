<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AD 盒子</title>
<style>
:root{
  --bg:#0d1117; --panel:#161d29; --panel2:#1d2636; --line:#2a3548;
  --text:#dce3ee; --dim:#8b98ac; --gold:#e8b64a; --green:#5fd38a; --red:#e06c6c; --blue:#5aa9e6;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:var(--bg);color:var(--text);font:13px/1.45 system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
#bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);
  border-bottom:1px solid var(--line);cursor:move}
#bar .title{font-weight:700;color:var(--gold);pointer-events:none}
#bar .status{flex:1;font-size:11px;color:var(--dim);pointer-events:none}
#bar button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:6px;padding:4px 9px;font:inherit;cursor:pointer}
#bar #btn-cap{border-color:var(--gold);color:var(--gold)}
#content{overflow-y:auto;height:calc(100vh - 41px);padding:6px}
#empty{padding:30px 16px;text-align:center;color:var(--dim);font-size:12px;line-height:2}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--gold)}
.note{font-size:11px;color:var(--dim);padding:2px 4px 6px}
.hgroup{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:4px}
.cell{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 1px;
  text-align:center;min-width:0}
.cell.body-c{border-color:var(--gold)}
.cell.ult-c{border-color:var(--blue)}
.cell img.main{width:36px;height:36px;border-radius:5px;object-fit:cover}
.cell .cwr{font-size:11px;font-weight:700;line-height:1.25}
.cell .cpk{font-size:9px;font-weight:400;color:var(--dim);margin-left:3px}
.cell .cpair{font-size:9px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:2px}
.cell .cpair img{width:12px;height:12px;border-radius:2px;object-fit:cover}
.wr-hi{color:var(--green)} .wr-lo{color:var(--red)} .wr-mid{color:var(--text)}
/* 折叠态：窗口缩成小徽标，只留 📷 识别 + ▼ 展开（新版宿主生效，老版 exe 回退原布局）。
   bar 改 inline-flex 以便 JS 量出自然宽高传给宿主；背景统一面板色，杜绝残留色条 */
body.folded .title,body.folded .status,body.folded #btn-upd,
body.folded #btn-close,body.folded #upbar,body.folded #content{display:none}
body.folded{background:var(--panel)}
body.folded #bar{display:inline-flex;border-bottom:none}
.hidden{display:none!important}
.weblink{color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#upbar{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;
  background:#2a2412;border-bottom:1px solid var(--gold);color:var(--gold)}
#upbar button{background:var(--gold);color:#1a1408;border:none;border-radius:6px;
  padding:3px 12px;font:inherit;font-weight:700;cursor:pointer}
#upbar #btn-updismiss{background:none;color:var(--dim);font-weight:400;padding:3px 4px}
</style>
</head>
<body>
<div id="bar" class="pywebview-drag-region">
  <span class="title">AD 盒子</span>
  <span class="status" id="status">待命 · 游戏中按 Ctrl+Shift+O</span>
  <button id="btn-cap">📷 识别</button>
  <button id="btn-upd" title="检查更新">⟳</button>
  <button id="btn-fold">▁</button>
  <button id="btn-close">✕</button>
</div>
<div id="upbar" class="hidden">
  <span style="flex:1">发现新版 <b id="upver"></b></span>
  <button id="btn-dl">下载</button><button id="btn-updismiss">✕</button>
</div>
<div id="content">
  <div id="empty">进入技能征召选人界面后<br>按 <kbd>Ctrl+Shift+O</kbd> 或点上方 📷<br><br>识别结果会显示每个英雄的<br>身板/技能胜率与最佳配对<br><br><span class="weblink">🌐 打开网页版（浏览器里模拟开局练手）</span></div>
  <div id="pool"></div>
</div>

<script src="data/bundle.js"></script>
<script>
const B = window.AD_BUNDLE;
const byId = new Map(B.entries.map(e => [e.id, e]));
const heroById = new Map(B.heroes.map(h => [h.id, h]));
const pairMap = new Map();
for (const [a, b, np, wr] of B.pairs) {
  pairMap.set((a < b ? a : b) + "_" + (a < b ? b : a), { np, wr });
}
const pair = (a, b) => pairMap.get((a < b ? a : b) + "_" + (a < b ? b : a));
const icon = e => e.id < 0 ? `img/heroes/${e.s}.png` : `img/abilities/${e.s}.png`;
const pct = x => (x * 100).toFixed(1) + "%";
const wrClass = x => x >= 0.52 ? "wr-hi" : x <= 0.48 ? "wr-lo" : "wr-mid";
// 池内顺位 → "轮-抢"：本池条目按平均被抢手数排出第 N 顺位，
// 10 手一轮折算显示，第 1 名 = 1-1，第 13 名 = 2-3
function buildRank(poolIds) {
  return new Map([...poolIds].map(id => byId.get(id)).filter(e => e && e.ap != null)
    .sort((a, b) => a.ap - b.ap).map((e, i) => [e.id, i + 1]));
}
const rankTag = (rank, id) => {
  const n = rank.get(id);
  if (!n) return "";
  const r = Math.ceil(n / 10);
  return `${r}-${n - (r - 1) * 10}`;
};
const $ = q => document.querySelector(q);

function topPairsInPool(id, poolIds, k = 3) {
  const out = [];
  for (const oid of poolIds) {
    if (oid === id) continue;
    const p = pair(id, oid);
    if (p && p.np >= 200) out.push({ oid, p });
  }
  return out.sort((a, b) => b.p.wr - a.p.wr).slice(0, k);
}

function render(result) {
  const ids = result.heroIds.filter(id => heroById.has(id));
  const heroes = ids.map(id => heroById.get(id));
  const poolIds = new Set();
  for (const h of heroes) {
    poolIds.add(h.body);
    h.ult.forEach(i => poolIds.add(i));
    h.norm.forEach(i => poolIds.add(i));
  }
  const rank = buildRank(poolIds);
  const el = $("#pool");
  el.innerHTML = `<div class="note">识别 ${heroes.length} 个候选英雄（强锁 ${result.lockedCount}）
    · ${result.elapsedMs || "?"}ms${heroes.length < 12 ? " · 不足 12 请目视补充" : ""}</div>`;
  for (const h of heroes) {
    const g = document.createElement("div");
    g.className = "hgroup";
    for (const id of [h.body, ...h.ult, ...h.norm]) {
      const e = byId.get(id);
      const cell = document.createElement("div");
      cell.className = "cell" + (e.id < 0 ? " body-c" : e.u ? " ult-c" : "");
      // 最多 3 条池内最佳配对，从上到下按胜率排，附搭档的池内顺位
      const tops = topPairsInPool(id, poolIds);
      const pairHtml = tops.length ? tops.map(bp => {
        const rt = rankTag(rank, bp.oid);
        return `<div class="cpair">○<img src="${icon(byId.get(bp.oid))}" title="${byId.get(bp.oid).n}">${pct(bp.p.wr)}${rt ? `<span class="cpk">${rt}</span>` : ""}</div>`;
      }).join("") : `<div class="cpair">—</div>`;
      const myRt = rankTag(rank, id);
      cell.innerHTML = `<img class="main" loading="lazy" src="${icon(e)}" title="${e.n}">
        <div class="cwr ${wrClass(e.wr)}">${pct(e.wr)}${myRt ? `<span class="cpk">${myRt}</span>` : ""}</div>${pairHtml}`;
      g.appendChild(cell);
    }
    el.appendChild(g);
  }
  el.insertAdjacentHTML("beforeend",
    `<div class="note" style="text-align:center;padding-top:6px"><span class="weblink">🌐 网页版练习</span></div>`);
  $("#empty").style.display = "none";
}

// 网页版入口：新版宿主用系统浏览器打开；老版宿主把链接亮在状态栏
const WEB_URL = "https://xiayuyosemi-d2goomeghaee6ee5b-1450725484.tcloudbaseapp.com/ad/";
document.addEventListener("click", e => {
  if (!e.target.closest(".weblink")) return;
  const api = window.pywebview && window.pywebview.api;
  if (api && api.open_url) api.open_url(WEB_URL);
  else $("#status").textContent = "网页版: " + WEB_URL;
});

// JS 异常直接显示在状态栏（悬浮窗没有 devtools，必须自曝）
window.onerror = (msg, src, line) => {
  $("#status").textContent = `页面错误: ${msg} @${line}`;
  return false;
};

// 轮询识别状态；打开面板时已有结果则立即渲染（不吞历史）
let lastSeq = null;
setInterval(async () => {
  try {
    const s = await (await fetch("api/state")).json();
    if (s.seq === lastSeq) return;
    lastSeq = s.seq;
    if (s.result && s.result.ok) {
      $("#status").textContent = `识别于 ${s.at} · 锁定 ${s.result.lockedCount}/12`;
      render(s.result);
      if (folded) setFold(false);  // 折叠时收到新结果 → 自动展开（实战反馈）
    } else if (s.result) {
      $("#status").textContent = s.result.reason || "识别失败";
    }
  } catch (e) { $("#status").textContent = "服务器未连接"; }
}, 1200);

// 与 pywebview 宿主交互
$("#btn-cap").onclick = async () => {
  $("#status").textContent = "识别中…";
  if (window.pywebview) window.pywebview.api.capture();
};
let folded = false;
// 窗口物理宽(480) / 页面 CSS 宽：换算比（吸收 DPI 缩放差异），页面加载时窗口必为展开态
const PXR = 480 / window.innerWidth;
function setFold(f) {
  folded = f;
  $("#btn-fold").textContent = folded ? "▼" : "▁";
  // 先套折叠样式（只剩 📷+▼ 的紧凑条），再量出实际宽高让宿主收窗
  document.body.classList.toggle("folded", folded);
  $("#btn-cap").textContent = folded ? "📷" : "📷 识别";
  if (!window.pywebview) return;
  const api = window.pywebview.api;
  const bar = $("#bar");
  const w = folded ? Math.ceil((bar.offsetWidth + 2) * PXR) : 480;
  const h = folded ? Math.ceil((bar.offsetHeight + 2) * PXR) : 820;
  // 老版 exe 宿主只认 fold(folded)，reject 后回退且不套折叠样式（保持整条栏可用）
  api.fold(folded, w, h).catch(() => {
    document.body.classList.remove("folded");
    $("#btn-cap").textContent = "📷 识别";
    api.fold(folded);
  });
}
$("#btn-fold").onclick = () => setFold(!folded);
$("#btn-close").onclick = () => { if (window.pywebview) window.pywebview.api.close(); };

// 手动检查更新：数据/页面就地热更；程序新版弹"下载"横条（老版宿主无此 API 则提示手动下载）
const RELEASES = "https://github.com/xiayuhkust/ad-draft-agent/releases/latest";
$("#btn-updismiss").onclick = () => $("#upbar").classList.add("hidden");
$("#btn-upd").onclick = async () => {
  const api = window.pywebview && window.pywebview.api;
  if (!api || !api.check_update) {
    $("#status").textContent = "此版本盒子不支持手动更新，请到 GitHub Releases 下载最新安装包";
    return;
  }
  $("#status").textContent = "检查更新中…";
  try {
    const r = await api.check_update();
    if (!r.ok) { $("#status").textContent = "检查失败: " + r.reason; return; }
    if (!r.enabled) { $("#status").textContent = "未配置更新源（exe 旁缺 update_url.txt）"; return; }
    if (r.newInstaller) {
      $("#upver").textContent = "v" + r.appVersion;
      $("#upbar").classList.remove("hidden");
      $("#status").textContent = `当前 v${r.localVersion || "?"}，可更新到 v${r.appVersion}`;
      $("#btn-dl").onclick = () => api.open_url(r.installerUrl || RELEASES);
    } else if (r.updated && r.updated.length) {
      $("#status").textContent = `已更新 ${r.updated.length} 个文件` +
        (r.codeChanged ? "，重启盒子后生效" : "，刷新即生效");
    } else {
      $("#status").textContent = `已是最新 v${r.localVersion || r.appVersion} · 数据 ${r.dataVersion}`;
    }
  } catch (e) {
    $("#status").textContent = "检查更新出错: " + e;
  }
};
</script>
</body>
</html>
